name: Sofia
description: >-
  Sofía is a 100% Mexican digital health insurance company that modernizes
  traditional medical coverage for enterprises, individuals, and families. Its
  plans combine zero-deductible major and minor medical care, preventive care
  with an assigned primary-care physician, and unlimited no-cost video
  consultations, all managed through a mobile app and an HR administrative
  portal. Sofía operates its own integrated medical network (SofíaMed) of
  hospitals and specialists, offers add-ons such as maternity, mental health,
  dental, and international coverage, and reimburses claims in an average of five
  business days. Backed by Ribbit Capital, Sofía positions insurance as a
  digital-first, member-centric health experience rather than a paper policy.
